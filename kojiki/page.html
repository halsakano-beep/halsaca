<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mincho;src:url(fonts/ShipporiMinchoB1.ttf) format('truetype');}
@font-face{font-family:Brush;src:url(fonts/YujiSyuku.ttf) format('truetype');}
@font-face{font-family:Cinzel;src:url(fonts/Cinzel.ttf) format('truetype');}
html,body{margin:0;background:#000;overflow:hidden}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style></head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<canvas id="tx" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080;
const SW = 1440, SH = 602;             // scene render resolution (2.39:1)
const BAR = Math.round((H - W / 2.39) / 2); // letterbox bar height in output px
let gl, TL, progs = {}, post = {}, fbo = {}, noiseTex, quad;

/* ---------- utilities ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function compile(src, type) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(s);
    const lines = src.split('\n').map((l, i) => (i + 1) + ': ' + l);
    const m = /0:(\d+)/.exec(log); const ln = m ? +m[1] : 0;
    throw new Error(log + '\n' + lines.slice(Math.max(0, ln - 4), ln + 2).join('\n'));
  }
  return s;
}
const VS = `#version 300 es
in vec2 aP; void main(){ gl_Position = vec4(aP,0.,1.); }`;
function program(fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VS, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER));
  gl.bindAttribLocation(p, 0, 'aP');
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); const name = info.name.replace(/\[0\]$/, ''); p.u[name] = gl.getUniformLocation(p, info.name); }
  return p;
}
function target(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('fbo incomplete');
  return { t, f, w, h };
}

/* 128^3 tileable smooth value noise (period 32 cells, 4 texels per cell, quintic) */
function makeNoise() {
  const P = 32, S = 128, R = mulberry(1337), lat = new Float32Array(P * P * P);
  for (let i = 0; i < lat.length; i++) lat[i] = R();
  const L = (x, y, z) => lat[((z & 31) * P + (y & 31)) * P + (x & 31)];
  const q = t => t * t * t * (t * (t * 6 - 15) + 10);
  const D = new Uint8Array(S * S * S);
  let k = 0;
  for (let z = 0; z < S; z++) { const fz = z / 4, iz = Math.floor(fz), uz = q(fz - iz);
    for (let y = 0; y < S; y++) { const fy = y / 4, iy = Math.floor(fy), uy = q(fy - iy);
      for (let x = 0; x < S; x++) { const fx = x / 4, ix = Math.floor(fx), ux = q(fx - ix);
        const a = L(ix, iy, iz) + (L(ix + 1, iy, iz) - L(ix, iy, iz)) * ux;
        const b = L(ix, iy + 1, iz) + (L(ix + 1, iy + 1, iz) - L(ix, iy + 1, iz)) * ux;
        const c = L(ix, iy, iz + 1) + (L(ix + 1, iy, iz + 1) - L(ix, iy, iz + 1)) * ux;
        const d = L(ix, iy + 1, iz + 1) + (L(ix + 1, iy + 1, iz + 1) - L(ix, iy + 1, iz + 1)) * ux;
        const e = a + (b - a) * uy, f = c + (d - c) * uy;
        D[k++] = Math.round((e + (f - e) * uz) * 255);
      } } }
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_3D, t);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage3D(gl.TEXTURE_3D, 0, gl.R8, S, S, S, 0, gl.RED, gl.UNSIGNED_BYTE, D);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_3D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  for (const w of [gl.TEXTURE_WRAP_S, gl.TEXTURE_WRAP_T, gl.TEXTURE_WRAP_R]) gl.texParameteri(gl.TEXTURE_3D, w, gl.REPEAT);
  return t;
}

/* ---------- init ---------- */
window.init = async function (src, timeline) {
  TL = timeline;
  gl = document.getElementById('gl').getContext('webgl2', { antialias: false, preserveDrawingBuffer: true, alpha: false });
  if (!gl.getExtension('EXT_color_buffer_float')) throw new Error('no float fbo');
  gl.getExtension('OES_texture_float_linear');
  quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  noiseTex = makeNoise();
  for (const s of TL.scenes) progs[s.id] = program(src.common + '\n' + src[s.id]);
  post.down = program(src.post_down); post.up = program(src.post_up); post.comp = program(src.post_comp);
  fbo.scene = target(SW, SH);
  fbo.mips = []; let w = SW, h = SH;
  for (let i = 0; i < 6; i++) { w = Math.max(1, w >> 1); h = Math.max(1, h >> 1); fbo.mips.push(target(w, h)); }
  await Promise.all(['Mincho', 'Brush', 'Cinzel'].map(f => document.fonts.load(`80px ${f}`, '天地KOJIKI')));
  await document.fonts.ready;
  return gl.getParameter(gl.getExtension('WEBGL_debug_renderer_info').UNMASKED_RENDERER_WEBGL);
};

/* ---------- time-driven parameters (composite) ---------- */
function envelope(t) {
  const C = TL.cues;
  let fade = 0, flash = 0;
  fade = Math.max(fade, 1 - sstep(0.0, 1.2, t));
  // cut 1: white bloom-out
  flash = Math.max(flash, sstep(14.3, 15.0, t) * (t < 15 ? 1 : 0), t >= 15 ? 1 - sstep(15.0, 16.2, t) : 0);
  // cut 2: fade through black
  fade = Math.max(fade, sstep(31.2, 32.0, t) * (t < 32 ? 1 : 0), t >= 32 ? 1 - sstep(32.0, 33.5, t) : 0);
  // cut 3: sun burst whiteout
  flash = Math.max(flash, t < 50 ? sstep(47.8, 50.0, t) : 1 - sstep(50.0, 50.9, t));
  // cut 4: after the slash
  flash = Math.max(flash, t < 65 ? sstep(64.1, 65.0, t) : 1 - sstep(65.0, 66.8, t));
  fade = Math.max(fade, sstep(81.5, 84.0, t));
  // slash: 0..1 progress of the cut line, then the split
  const slash = clamp((t - C.slash) / 1.2, 0, 1) * (t < 65 ? 1 : 0);
  // camera shake amount
  let shake = 0;
  shake += Math.exp(-Math.max(0, t - C.divide) * 3) * (t > C.divide ? 1 : 0);
  shake += Math.exp(-Math.max(0, t - C.impact) * 2.5) * (t > C.impact ? 1.2 : 0);
  shake += (t > C.door && t < C.burst + 2 ? 0.5 + 0.8 * Math.exp(-Math.max(0, t - C.burst) * 2) * (t > C.burst ? 1 : 0) : 0);
  shake += Math.exp(-Math.max(0, t - C.eyes) * 3) * (t > C.eyes ? 1 : 0);
  for (const b of C.lightning) shake += (t > b ? Math.exp(-(t - b) * 5) * 0.6 : 0);
  // beat pulse for the Iwato dance
  let beat = 0;
  for (const b of TL.iwato_beats) if (t >= b) beat = Math.max(beat, Math.exp(-(t - b) * 7));
  return { fade, flash, slash, shake, beat };
}

/* ---------- render ---------- */
function bindNoise(p) { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_3D, noiseTex); gl.uniform1i(p.u.uN, 1); }
function drawTo(f) { gl.bindFramebuffer(gl.FRAMEBUFFER, f ? f.f : null); gl.viewport(0, 0, f ? f.w : W, f ? f.h : H); gl.drawArrays(gl.TRIANGLES, 0, 3); }

window.renderAt = function (t) {
  let sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const env = envelope(t);
  const p = progs[sc.id];
  gl.disable(gl.BLEND);
  gl.useProgram(p); bindNoise(p);
  gl.uniform1f(p.u.uT, t); gl.uniform1f(p.u.uL, t - sc.start);
  gl.uniform2f(p.u.uRes, SW, SH);
  if (p.u.uBeat) gl.uniform1f(p.u.uBeat, env.beat);
  if (p.u.uShake) gl.uniform1f(p.u.uShake, env.shake);
  drawTo(fbo.scene);

  // bloom: downsample chain
  gl.useProgram(post.down);
  let src = fbo.scene;
  for (let i = 0; i < fbo.mips.length; i++) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, src.t);
    gl.uniform1i(post.down.u.uSrc, 0); gl.uniform2f(post.down.u.uTexel, 1 / src.w, 1 / src.h);
    gl.uniform1i(post.down.u.uFirst, i === 0 ? 1 : 0);
    gl.uniform2f(post.down.u.uDst, 1 / fbo.mips[i].w, 1 / fbo.mips[i].h);
    drawTo(fbo.mips[i]); src = fbo.mips[i];
  }
  // upsample + accumulate
  gl.useProgram(post.up); gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  for (let i = fbo.mips.length - 1; i > 0; i--) {
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo.mips[i].t);
    gl.uniform1i(post.up.u.uSrc, 0); gl.uniform2f(post.up.u.uTexel, 1 / fbo.mips[i].w, 1 / fbo.mips[i].h);
    gl.uniform2f(post.up.u.uDst, 1 / fbo.mips[i - 1].w, 1 / fbo.mips[i - 1].h);
    drawTo(fbo.mips[i - 1]);
  }
  gl.disable(gl.BLEND);

  // composite
  const c = post.comp; gl.useProgram(c);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo.scene.t); gl.uniform1i(c.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, fbo.mips[0].t); gl.uniform1i(c.u.uBloom, 2);
  gl.uniform2f(c.u.uOut, W, H); gl.uniform1f(c.u.uBar, BAR);
  gl.uniform1f(c.u.uT, t); gl.uniform1f(c.u.uFade, env.fade); gl.uniform1f(c.u.uFlash, env.flash);
  gl.uniform1f(c.u.uSlash, env.slash);
  gl.uniform1f(c.u.uBloomK, sc.id === 's1_chaos' ? 0.9 : sc.id === 's3_iwato' ? 0.85 : sc.id === 's5_dawn' ? 0.6 : 0.75);
  drawTo(null);

  drawText(t);
  gl.finish();
  return sc.id;
};

/* ---------- typography ---------- */
const tx = document.getElementById('tx').getContext('2d');
const TEXTS = [
  // kind: v = vertical, h = horizontal ; x,y in output px (centre), size px
  { t0: 2.2,  t1: 7.8,  kind: 'v', txt: '天地初発之時', font: 'Mincho', size: 64, x: 1500, y: 290, col: [255, 236, 200], glow: [255, 170, 80] },
  { t0: 2.8,  t1: 7.8,  kind: 'sub', txt: 'In the beginning, when heaven and earth first parted', y: 1010 },
  { t0: 10.6, t1: 14.6, kind: 'h', txt: '天地開闢', font: 'Brush', size: 150, x: 960, y: 560, col: [255, 246, 225], glow: [255, 190, 90], spacing: 40 },
  { t0: 11.0, t1: 14.6, kind: 'sub', txt: 'TENCHI KAIBYAKU  —  THE PARTING OF HEAVEN AND EARTH', y: 1010 },
  { t0: 17.4, t1: 22.4, kind: 'v', txt: '国生み', font: 'Brush', size: 120, x: 330, y: 260, col: [240, 250, 255], glow: [120, 200, 255] },
  { t0: 17.8, t1: 22.4, kind: 'sub', txt: 'KUNIUMI  —  THE HEAVENLY SPEAR STIRS THE PRIMORDIAL SEA', y: 1010 },
  { t0: 28.4, t1: 31.4, kind: 'v', txt: '淤能碁呂島', font: 'Mincho', size: 54, x: 1600, y: 300, col: [255, 236, 200], glow: [255, 150, 60] },
  { t0: 28.6, t1: 31.4, kind: 'sub', txt: 'ONOGORO  —  THE FIRST LAND, BORN OF A SINGLE DROP', y: 1010 },
  { t0: 33.2, t1: 38.4, kind: 'v', txt: '天岩戸', font: 'Brush', size: 120, x: 1560, y: 260, col: [255, 225, 190], glow: [255, 110, 40] },
  { t0: 33.6, t1: 38.4, kind: 'sub', txt: 'AMA-NO-IWATO  —  THE SUN GODDESS HIDES, AND THE WORLD FALLS DARK', y: 1010 },
  { t0: 46.2, t1: 49.6, kind: 'h', txt: '天照大御神', font: 'Brush', size: 128, x: 960, y: 560, col: [22, 12, 6], glow: [255, 236, 200], spacing: 22 },
  { t0: 46.5, t1: 49.6, kind: 'sub', txt: 'AMATERASU-ŌMIKAMI  —  THE LIGHT RETURNS', y: 1010 },
  { t0: 53.6, t1: 58.6, kind: 'v', txt: '八岐大蛇', font: 'Brush', size: 128, x: 300, y: 240, col: [255, 215, 205], glow: [255, 30, 20] },
  { t0: 54.0, t1: 58.6, kind: 'sub', txt: 'YAMATA-NO-OROCHI  —  EIGHT HEADS, EIGHT TAILS, EIGHT VALLEYS', y: 1010 },
  { t0: 60.2, t1: 63.4, kind: 'v', txt: '須佐之男命', font: 'Mincho', size: 62, x: 1620, y: 270, col: [230, 240, 255], glow: [140, 180, 255] },
  { t0: 60.5, t1: 63.4, kind: 'sub', txt: 'SUSANOO  —  THE STORM GOD DRAWS HIS BLADE', y: 1010 },
  { t0: 71.0, t1: 84.0, kind: 'title' },
];
function alphaOf(e, t) {
  const fi = sstep(e.t0, e.t0 + 1.0, t), fo = 1 - sstep(e.t1 - 1.0, e.t1, t);
  return fi * fo;
}
const glyph = document.createElement('canvas'); glyph.width = glyph.height = 640;
const gx = glyph.getContext('2d');
function glowText(ch, x, y, col, glow, a, blurIn) {
  // render the glyph (with glows) on a small offscreen canvas so blur filters stay cheap
  const font = tx.font, fs = parseFloat(/(\d+(\.\d+)?)px/.exec(font)[1]);
  const S = Math.min(640, Math.ceil(fs * 2.2 + 120));
  gx.setTransform(1, 0, 0, 1, 0, 0); gx.clearRect(0, 0, S, S);
  gx.font = font; gx.textAlign = 'center'; gx.textBaseline = 'middle';
  gx.filter = blurIn > 0.05 ? `blur(${blurIn.toFixed(2)}px)` : 'none';
  gx.shadowColor = `rgba(${glow[0]},${glow[1]},${glow[2]},0.9)`;
  gx.fillStyle = `rgb(${col})`;
  gx.shadowBlur = 38; gx.fillText(ch, S / 2, S / 2);
  gx.shadowBlur = 12; gx.fillText(ch, S / 2, S / 2);
  if (blurIn < 1.5) { gx.filter = 'none'; gx.shadowColor = 'rgba(0,0,0,0.4)'; gx.shadowBlur = 3; gx.fillText(ch, S / 2, S / 2); }
  gx.filter = 'none';
  tx.save(); tx.globalAlpha = a;
  tx.drawImage(glyph, 0, 0, S, S, x - S / 2, y - S / 2, S, S);
  tx.restore();
}
function drawText(t) {
  tx.clearRect(0, 0, W, H);
  tx.textAlign = 'center'; tx.textBaseline = 'middle';
  for (const e of TEXTS) {
    if (t < e.t0 || t > e.t1) continue;
    if (e.kind === 'title') { drawTitle(t, e); continue; }
    const A = alphaOf(e, t);
    if (e.kind === 'sub') {
      tx.save(); tx.font = '400 24px Cinzel'; tx.letterSpacing = '6px';
      tx.globalAlpha = A * 0.85; tx.fillStyle = '#d9cdb4'; tx.fillText(e.txt, 960, e.y); tx.restore();
      continue;
    }
    tx.font = `${e.size}px ${e.font}`;
    const chars = [...e.txt], n = chars.length;
    const dur = Math.min(1.6, (e.t1 - e.t0) * 0.35);
    const drift = (t - e.t0) * 4; // slow upward drift in px
    chars.forEach((ch, i) => {
      const ci = e.t0 + dur * (i / n);
      const a = sstep(ci, ci + 0.7, t) * (1 - sstep(e.t1 - 1.0 + i * 0.06, e.t1, t));
      if (a <= 0) return;
      const blur = (1 - sstep(ci, ci + 0.9, t)) * 14 + (1 - (1 - sstep(e.t1 - 1.0, e.t1, t))) * 10;
      let x, y;
      if (e.kind === 'v') { x = e.x; y = e.y + i * e.size * 1.12 - drift * 0.3; }
      else { const step = e.size + e.spacing; x = e.x + (i - (n - 1) / 2) * step; y = e.y - drift * 0.2; }
      glowText(ch, x, y + (1 - a) * 18, e.col, e.glow, a, blur);
    });
  }
}
function drawTitle(t, e) {
  const L = t - e.t0;
  // 古事記 — brush strokes resolving out of blur, huge, warm gold
  tx.font = '230px Brush';
  const chars = ['古', '事', '記'];
  const out = 1 - sstep(10.2, 12.6, L);
  chars.forEach((ch, i) => {
    const ci = 0.25 + i * 0.45;
    const a = sstep(ci, ci + 1.3, L) * out;
    if (a <= 0) return;
    const blur = (1 - sstep(ci, ci + 1.6, L)) * 26;
    const sc = 1.18 - 0.18 * sstep(ci, ci + 2.2, L) + L * 0.004;
    tx.save(); tx.translate(960 + (i - 1) * 300 * sc, 470); tx.scale(sc, sc);
    glowText(ch, 0, 0, [255, 244, 222], [255, 170, 70], a, blur);
    tx.restore();
  });
  // KOJIKI
  const a2 = sstep(2.2, 3.8, L) * out;
  if (a2 > 0) {
    tx.save(); tx.font = '400 46px Cinzel'; tx.letterSpacing = `${28 + 10 * sstep(2.2, 7, L)}px`;
    tx.globalAlpha = a2; tx.shadowColor = 'rgba(40,14,0,0.75)'; tx.shadowBlur = 14; tx.fillStyle = '#fff3dc';
    tx.fillText('KOJIKI', 960 + 14, 668); tx.restore();
    // thin gold rules
    tx.save(); tx.globalAlpha = a2 * 0.7; tx.strokeStyle = '#e8c890'; tx.lineWidth = 1.2;
    const w = 260 * sstep(2.4, 5.0, L);
    tx.restore();
  }
  const a3 = sstep(4.2, 5.8, L) * out;
  if (a3 > 0) {
    tx.save(); tx.font = '34px Mincho'; tx.letterSpacing = '16px';
    tx.globalAlpha = a3; tx.shadowColor = 'rgba(255,190,120,0.55)'; tx.shadowBlur = 14; tx.fillStyle = '#f3e6d0';
    tx.fillText('神代より、今へ。', 960 + 8, 988); tx.restore();
    tx.save(); tx.font = '400 17px Cinzel'; tx.letterSpacing = '8px'; tx.globalAlpha = a3 * 0.7; tx.fillStyle = '#d9cdb4';
    tx.fillText('FROM THE AGE OF THE GODS  —  TO NOW', 960, 1036); tx.restore();
  }
}
</script>
</body></html>
